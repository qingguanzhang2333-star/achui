<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge - 图片/视频风格化工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0f1c;
  --surface: #1e293b;
  --surface2: #0f172a;
  --cyan: #22d3ee;
  --purple: #a855f7;
  --green: #4ade80;
  --orange: #f97316;
  --text: #ffffff;
  --text2: #94a3b8;
  --text3: #64748b;
  --border: #334155;
  --radius: 8px;
}

body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 20px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: var(--bg);
  font-family: 'Courier New', monospace;
}

.header-actions {
  display: flex;
  gap: 12px;
}

.btn {
  padding: 8px 20px;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--cyan);
  color: var(--bg);
}

.btn-primary:hover { background: #06b6d4; }

.btn-secondary {
  background: var(--surface);
  color: var(--text2);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--text3);
  color: var(--text);
}

.btn-ghost {
  background: none;
  color: var(--text2);
}

.btn-ghost:hover { color: var(--text); }

main {
  display: flex;
  height: calc(100vh - 65px);
}

/* Sidebar Controls */
.sidebar {
  width: 320px;
  min-width: 320px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.panel-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-section h3 {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--cyan);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text2);
}

.control-value {
  font-family: 'Courier New', monospace;
  color: var(--cyan);
  font-size: 12px;
  font-weight: 600;
}

input[type="range"] {
  width: 100%;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--surface2);
  border-radius: 2px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--cyan);
  cursor: pointer;
  border: 2px solid var(--bg);
}

select, .text-input {
  width: 100%;
  padding: 8px 12px;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  font-family: inherit;
}

select:focus, .text-input:focus {
  border-color: var(--cyan);
}

select option { background: var(--surface2); }

.style-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface2);
  border-radius: 8px;
  padding: 4px;
}

.style-tab {
  flex: 1;
  padding: 8px 4px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.style-tab.active {
  background: var(--cyan);
  color: var(--bg);
}

.style-tab:hover:not(.active) {
  color: var(--text);
  background: rgba(255,255,255,0.05);
}

.color-palette-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.color-swatch {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.color-swatch.active {
  border-color: var(--text);
  transform: scale(1.15);
}

.color-swatch:hover { transform: scale(1.1); }

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
}

.checkbox-group input[type="checkbox"] {
  accent-color: var(--cyan);
  width: 16px;
  height: 16px;
}

/* Canvas Area */
.canvas-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

.canvas-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.canvas-toolbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.canvas-toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.zoom-control {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Courier New', monospace;
  color: var(--text2);
  font-size: 12px;
}

.zoom-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.zoom-btn:hover { border-color: var(--text3); color: var(--text); }

.canvas-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: auto;
  padding: 24px;
}

.canvas-wrapper {
  position: relative;
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.canvas-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.canvas-panel-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text3);
  text-align: center;
}

canvas {
  border-radius: 8px;
  background: var(--surface2);
  image-rendering: auto;
}

#outputCanvas {
  image-rendering: pixelated;
}

.ascii-output {
  background: var(--surface2);
  border-radius: 8px;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: 6px;
  line-height: 1;
  white-space: pre;
  color: var(--text);
  overflow: auto;
  max-height: 600px;
  max-width: 800px;
  border: 1px solid var(--border);
  display: none;
}

.ascii-output.colored span { display: inline; }

/* Upload Area */
.upload-area {
  width: 600px;
  height: 400px;
  border: 2px dashed var(--border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  cursor: pointer;
  transition: all 0.3s;
  background: rgba(30, 41, 59, 0.3);
}

.upload-area:hover, .upload-area.dragover {
  border-color: var(--cyan);
  background: rgba(34, 211, 238, 0.05);
}

.upload-area svg {
  width: 64px;
  height: 64px;
  color: var(--text3);
}

.upload-area.dragover svg { color: var(--cyan); }

.upload-area h2 {
  font-size: 20px;
  font-weight: 600;
}

.upload-area p {
  font-size: 14px;
  color: var(--text3);
}

.upload-hint {
  font-size: 12px;
  color: var(--text3);
  margin-top: 8px;
}

.file-input { display: none; }

/* Export panel */
.export-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.export-group .btn { width: 100%; justify-content: center; }

/* Status */
.status-bar {
  font-size: 12px;
  color: var(--text3);
  font-family: 'Courier New', monospace;
  padding: 0 20px 0 0;
}

/* Comparison slider */
.comparison-container {
  position: relative;
  display: inline-block;
}

.comparison-container canvas {
  display: block;
}

/* Split view toggle */
.view-tabs {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border-radius: 6px;
  padding: 2px;
}

.view-tab {
  padding: 4px 12px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.view-tab.active {
  background: var(--surface);
  color: var(--text);
}

.hidden { display: none !important; }

/* Responsive */
@media (max-width: 900px) {
  main { flex-direction: column; }
  .sidebar { width: 100%; min-width: auto; max-height: 50vh; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">PX</div>
    <span>PixelForge</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="resetBtn">↺ 重置</button>
    <button class="btn btn-secondary" id="importBtn">📂 打开文件</button>
    <button class="btn btn-primary" id="exportBtn">⬇ 导出</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <!-- Style Mode -->
    <div class="panel-section">
      <h3>风格模式</h3>
      <div class="style-tabs">
        <button class="style-tab active" data-mode="pixel">像素化</button>
        <button class="style-tab" data-mode="dot">点阵化</button>
        <button class="style-tab" data-mode="ascii">ASCII</button>
        <button class="style-tab" data-mode="halftone">半色调</button>
      </div>
    </div>

    <!-- Common Controls -->
    <div class="panel-section" id="commonControls">
      <h3>基本参数</h3>
      <div class="control-group">
        <div class="control-label">
          <span>分辨率 / 块大小</span>
          <span class="control-value" id="blockSizeValue">8</span>
        </div>
        <input type="range" id="blockSize" min="2" max="64" value="8" step="1">
      </div>
      <div class="control-group">
        <div class="control-label">
          <span>亮度</span>
          <span class="control-value" id="brightnessValue">0</span>
        </div>
        <input type="range" id="brightness" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-group">
        <div class="control-label">
          <span>对比度</span>
          <span class="control-value" id="contrastValue">0</span>
        </div>
        <input type="range" id="contrast" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="grayscale"> 灰度模式
        </label>
      </div>
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="invertColors"> 反色
        </label>
      </div>
    </div>

    <!-- Pixel-specific -->
    <div class="panel-section mode-controls" id="pixelControls">
      <h3>像素化参数</h3>
      <div class="control-group">
        <div class="control-label"><span>颜色数量</span><span class="control-value" id="colorCountValue">0 (无限)</span></div>
        <input type="range" id="colorCount" min="0" max="64" value="0" step="1">
      </div>
      <div class="control-group">
        <div class="control-label"><span>像素边框</span><span class="control-value" id="pixelBorderValue">0</span></div>
        <input type="range" id="pixelBorder" min="0" max="4" value="0" step="1">
      </div>
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="roundPixels"> 圆角像素
        </label>
      </div>
    </div>

    <!-- Dot-specific -->
    <div class="panel-section mode-controls hidden" id="dotControls">
      <h3>点阵参数</h3>
      <div class="control-group">
        <div class="control-label"><span>点大小比例</span><span class="control-value" id="dotScaleValue">0.8</span></div>
        <input type="range" id="dotScale" min="0.1" max="1.5" value="0.8" step="0.05">
      </div>
      <div class="control-group">
        <div class="control-label">点形状</div>
        <select id="dotShape">
          <option value="circle">圆形</option>
          <option value="square">方形</option>
          <option value="diamond">菱形</option>
          <option value="cross">十字形</option>
        </select>
      </div>
      <div class="control-group">
        <div class="control-label"><span>背景色</span></div>
        <input type="color" id="dotBgColor" value="#0a0f1c" class="text-input" style="height:36px;padding:4px;">
      </div>
    </div>

    <!-- ASCII-specific -->
    <div class="panel-section mode-controls hidden" id="asciiControls">
      <h3>ASCII 参数</h3>
      <div class="control-group">
        <div class="control-label"><span>字体大小</span><span class="control-value" id="fontSizeValue">10</span></div>
        <input type="range" id="fontSize" min="4" max="20" value="10" step="1">
      </div>
      <div class="control-group">
        <div class="control-label">字符集</div>
        <select id="charset">
          <option value="standard">标准 (@#$%&*+-=:.)</option>
          <option value="blocks">方块 (█▓▒░)</option>
          <option value="braille">盲文点字</option>
          <option value="simple">简洁 (#=-:. )</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="control-group hidden" id="customCharsetGroup">
        <div class="control-label">自定义字符 (由亮到暗)</div>
        <input type="text" class="text-input" id="customCharset" value="@#S%?*+;:,. " placeholder="输入字符...">
      </div>
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="coloredAscii" checked> 彩色字符
        </label>
      </div>
    </div>

    <!-- Halftone-specific -->
    <div class="panel-section mode-controls hidden" id="halftoneControls">
      <h3>半色调参数</h3>
      <div class="control-group">
        <div class="control-label"><span>角度</span><span class="control-value" id="halftoneAngleValue">45°</span></div>
        <input type="range" id="halftoneAngle" min="0" max="180" value="45" step="5">
      </div>
      <div class="control-group">
        <div class="control-label"><span>点大小</span><span class="control-value" id="halftoneSizeValue">1.0</span></div>
        <input type="range" id="halftoneSize" min="0.2" max="2" value="1" step="0.1">
      </div>
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="halftoneCMYK"> CMYK 分色
        </label>
      </div>
    </div>

    <!-- Color Palette -->
    <div class="panel-section" id="paletteSection">
      <h3>调色板预设</h3>
      <select id="paletteSelect">
        <option value="none">原色 (不限制)</option>
        <option value="gameboy">Game Boy</option>
        <option value="nes">NES</option>
        <option value="cga">CGA</option>
        <option value="mono">黑白</option>
        <option value="sepia">复古棕</option>
        <option value="cyberpunk">赛博朋克</option>
        <option value="pastel">粉彩</option>
        <option value="earth">大地色</option>
      </select>
      <div class="color-palette-grid" id="palettePreview"></div>
    </div>

    <!-- Export -->
    <div class="panel-section">
      <h3>导出</h3>
      <div class="export-group">
        <button class="btn btn-primary" id="exportPngBtn">⬇ 导出 PNG</button>
        <button class="btn btn-secondary" id="exportTextBtn">📄 导出文本 (ASCII)</button>
        <button class="btn btn-secondary" id="copyAsciiBtn">📋 复制到剪贴板</button>
      </div>
    </div>
  </aside>

  <div class="canvas-area">
    <div class="canvas-toolbar">
      <div class="canvas-toolbar-left">
        <div class="view-tabs">
          <button class="view-tab active" data-view="split">双栏对比</button>
          <button class="view-tab" data-view="output">仅结果</button>
        </div>
        <span class="status-bar" id="statusBar">等待上传图片...</span>
      </div>
      <div class="canvas-toolbar-right">
        <div class="zoom-control">
          <button class="zoom-btn" id="zoomOut">−</button>
          <span id="zoomLevel">100%</span>
          <button class="zoom-btn" id="zoomIn">+</button>
          <button class="zoom-btn" id="zoomFit" title="适应窗口">⊡</button>
        </div>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <!-- Upload area -->
      <div class="upload-area" id="uploadArea">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <h2>拖放图片到这里</h2>
        <p>支持 JPG, PNG, GIF, WebP, BMP 格式</p>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn btn-primary" id="pickFileBtn">选择文件</button>
          <button class="btn btn-secondary" id="pasteBtn">从剪贴板粘贴</button>
        </div>
        <p class="upload-hint">也可以直接 Ctrl+V 粘贴图片</p>
      </div>

      <!-- Canvas workspace -->
      <div class="canvas-wrapper hidden" id="canvasWrapper">
        <div class="canvas-panel" id="originalPanel">
          <div class="canvas-panel-label">原图</div>
          <canvas id="sourceCanvas"></canvas>
        </div>
        <div class="canvas-panel">
          <div class="canvas-panel-label">效果</div>
          <canvas id="outputCanvas"></canvas>
          <pre class="ascii-output" id="asciiOutput"></pre>
        </div>
      </div>
    </div>
  </div>
</main>

<input type="file" class="file-input" id="fileInput" accept="image/*">

<script>
const PALETTES = {
  none: null,
  gameboy: ['#0f380f','#306230','#8bac0f','#9bbc0f'],
  nes: ['#000000','#fcfcfc','#f8f8f8','#bcbcbc','#7c7c7c','#a4e4fc','#3cbcfc','#0078f8','#0000fc','#b8b8f8','#6888fc','#0058f8','#0000bc','#d8b8f8','#9878f8','#6844fc','#4428bc','#f8b8f8','#f878f8','#d800cc','#940084','#f8a4c0','#f85898','#e40058','#a80020','#f0d0b0','#f87858','#f83800','#a81000','#fce0a8','#fca044','#e45c10','#881400','#f8d878','#f8b800','#ac7c00','#503000','#d8f878','#b8f818','#00b800','#007800','#b8f8b8','#58d854','#00a800','#006800','#b8f8d8','#58f898','#00a844','#005800','#00fcfc','#00e8d8','#008888','#004058'],
  cga: ['#000000','#555555','#aaaaaa','#ffffff','#0000aa','#5555ff','#00aa00','#55ff55','#00aaaa','#55ffff','#aa0000','#ff5555','#aa00aa','#ff55ff','#aa5500','#ffff55'],
  mono: ['#000000','#ffffff'],
  sepia: ['#704214','#c68642','#e0ac69','#f1c27d','#ffdbac','#2c1810','#8d5524','#4a2c0a'],
  cyberpunk: ['#0d0221','#0a0a2e','#150050','#3f0071','#610094','#fb2576','#ff1493','#00f5ff','#39ff14','#ff6600','#1b1b2f','#e94560'],
  pastel: ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0','#ff9f43','#ee5a24','#c8d6e5','#8395a7'],
  earth: ['#2d1b00','#5c3a1e','#8b6914','#a0522d','#cd853f','#deb887','#f5deb3','#556b2f','#6b8e23','#8fbc8f','#2f4f4f','#696969'],
};

const CHARSETS = {
  standard: '@#S%?*+;:,. ',
  blocks: '█▓▒░ ',
  braille: null,
  simple: '#=-:. ',
  custom: null,
};

let state = {
  mode: 'pixel',
  view: 'split',
  zoom: 1,
  sourceImg: null,
  sourceData: null,
  processing: false,
};

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

// DOM refs
const fileInput = $('fileInput');
const uploadArea = $('uploadArea');
const canvasWrapper = $('canvasWrapper');
const sourceCanvas = $('sourceCanvas');
const outputCanvas = $('outputCanvas');
const asciiOutput = $('asciiOutput');
const statusBar = $('statusBar');

const srcCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
const outCtx = outputCanvas.getContext('2d', { willReadFrequently: true });

// ============================================================
// Event Binding
// ============================================================

// File input
$('pickFileBtn').onclick = e => { e.stopPropagation(); fileInput.click(); };
$('importBtn').onclick = () => fileInput.click();
uploadArea.onclick = () => fileInput.click();
fileInput.onchange = e => { if (e.target.files[0]) loadImage(e.target.files[0]); };

// Drag & drop
uploadArea.ondragover = e => { e.preventDefault(); uploadArea.classList.add('dragover'); };
uploadArea.ondragleave = () => uploadArea.classList.remove('dragover');
uploadArea.ondrop = e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImage(file);
};

// Paste
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      loadImage(item.getAsFile());
      return;
    }
  }
});
$('pasteBtn').onclick = async (e) => {
  e.stopPropagation();
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          loadImage(blob);
          return;
        }
      }
    }
  } catch { alert('无法访问剪贴板，请使用 Ctrl+V'); }
};

// Style tabs
$$('.style-tab').forEach(tab => {
  tab.onclick = () => {
    $$('.style-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.mode = tab.dataset.mode;
    updateModeControls();
    render();
  };
});

// View tabs
$$('.view-tab').forEach(tab => {
  tab.onclick = () => {
    $$('.view-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.view = tab.dataset.view;
    $('originalPanel').classList.toggle('hidden', state.view === 'output');
  };
});

// Zoom
$('zoomIn').onclick = () => setZoom(state.zoom + 0.25);
$('zoomOut').onclick = () => setZoom(state.zoom - 0.25);
$('zoomFit').onclick = fitZoom;

// Reset
$('resetBtn').onclick = () => {
  state.sourceImg = null;
  state.sourceData = null;
  uploadArea.classList.remove('hidden');
  canvasWrapper.classList.add('hidden');
  statusBar.textContent = '等待上传图片...';
};

// All sliders: update value display & re-render
const sliderBindings = [
  ['blockSize', 'blockSizeValue', v => v],
  ['brightness', 'brightnessValue', v => v],
  ['contrast', 'contrastValue', v => v],
  ['colorCount', 'colorCountValue', v => v == 0 ? '0 (无限)' : v],
  ['pixelBorder', 'pixelBorderValue', v => v],
  ['dotScale', 'dotScaleValue', v => v],
  ['fontSize', 'fontSizeValue', v => v],
  ['halftoneAngle', 'halftoneAngleValue', v => v + '°'],
  ['halftoneSize', 'halftoneSizeValue', v => v],
];

sliderBindings.forEach(([inputId, displayId, fmt]) => {
  const el = $(inputId);
  if (!el) return;
  el.oninput = () => {
    $(displayId).textContent = fmt(el.value);
    scheduleRender();
  };
});

// Checkboxes and selects
['grayscale','invertColors','roundPixels','coloredAscii','halftoneCMYK'].forEach(id => {
  const el = $(id);
  if (el) el.onchange = () => scheduleRender();
});

['paletteSelect','charset','dotShape','dotBgColor'].forEach(id => {
  const el = $(id);
  if (el) el.onchange = () => {
    if (id === 'charset') {
      $('customCharsetGroup').classList.toggle('hidden', el.value !== 'custom');
    }
    if (id === 'paletteSelect') updatePalettePreview();
    scheduleRender();
  };
});

$('customCharset').oninput = () => scheduleRender();

// Export
$('exportBtn').onclick = () => $('exportPngBtn').click();
$('exportPngBtn').onclick = exportPng;
$('exportTextBtn').onclick = exportText;
$('copyAsciiBtn').onclick = copyAscii;

// ============================================================
// Image Loading
// ============================================================

function loadImage(source) {
  const img = new Image();
  img.onload = () => {
    state.sourceImg = img;
    const maxDim = 1920;
    let w = img.width, h = img.height;
    if (w > maxDim || h > maxDim) {
      const s = maxDim / Math.max(w, h);
      w = Math.round(w * s);
      h = Math.round(h * s);
    }
    sourceCanvas.width = w;
    sourceCanvas.height = h;
    srcCtx.drawImage(img, 0, 0, w, h);
    state.sourceData = srcCtx.getImageData(0, 0, w, h);
    outputCanvas.width = w;
    outputCanvas.height = h;

    uploadArea.classList.add('hidden');
    canvasWrapper.classList.remove('hidden');
    statusBar.textContent = `${img.width}×${img.height} → ${w}×${h}`;
    fitZoom();
    render();
  };
  if (source instanceof Blob) {
    img.src = URL.createObjectURL(source);
  } else {
    img.src = source;
  }
}

// ============================================================
// Zoom
// ============================================================

function setZoom(z) {
  state.zoom = Math.max(0.1, Math.min(5, z));
  $('zoomLevel').textContent = Math.round(state.zoom * 100) + '%';
  applyZoom();
}

function applyZoom() {
  const z = state.zoom;
  sourceCanvas.style.width = (sourceCanvas.width * z) + 'px';
  sourceCanvas.style.height = (sourceCanvas.height * z) + 'px';
  outputCanvas.style.width = (outputCanvas.width * z) + 'px';
  outputCanvas.style.height = (outputCanvas.height * z) + 'px';
}

function fitZoom() {
  if (!state.sourceImg) return;
  const container = $('canvasContainer');
  const cw = container.clientWidth - 80;
  const ch = container.clientHeight - 80;
  const panels = state.view === 'split' ? 2 : 1;
  const availW = (cw - (panels > 1 ? 24 : 0)) / panels;
  const z = Math.min(availW / sourceCanvas.width, ch / sourceCanvas.height, 1);
  setZoom(z);
}

// ============================================================
// Rendering
// ============================================================

let renderTimer = null;
function scheduleRender() {
  if (renderTimer) cancelAnimationFrame(renderTimer);
  renderTimer = requestAnimationFrame(render);
}

function render() {
  if (!state.sourceData || state.processing) return;
  state.processing = true;
  const t0 = performance.now();

  const isAscii = state.mode === 'ascii';
  outputCanvas.style.display = isAscii ? 'none' : '';
  asciiOutput.style.display = isAscii ? '' : 'none';

  const imgData = applyAdjustments(state.sourceData);

  switch (state.mode) {
    case 'pixel': renderPixel(imgData); break;
    case 'dot': renderDot(imgData); break;
    case 'ascii': renderAscii(imgData); break;
    case 'halftone': renderHalftone(imgData); break;
  }

  const ms = (performance.now() - t0).toFixed(1);
  statusBar.textContent = `${sourceCanvas.width}×${sourceCanvas.height} | ${state.mode} | ${ms}ms`;
  state.processing = false;
}

function applyAdjustments(src) {
  const w = src.width, h = src.height;
  const copy = new ImageData(new Uint8ClampedArray(src.data), w, h);
  const d = copy.data;
  const bright = +$('brightness').value;
  const cont = +$('contrast').value;
  const gray = $('grayscale').checked;
  const invert = $('invertColors').checked;
  const factor = (259 * (cont + 255)) / (255 * (259 - cont));

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];
    r = Math.min(255, Math.max(0, factor * (r - 128) + 128 + bright));
    g = Math.min(255, Math.max(0, factor * (g - 128) + 128 + bright));
    b = Math.min(255, Math.max(0, factor * (b - 128) + 128 + bright));
    if (gray) {
      const l = 0.299 * r + 0.587 * g + 0.114 * b;
      r = g = b = l;
    }
    if (invert) { r = 255 - r; g = 255 - g; b = 255 - b; }
    d[i] = r; d[i+1] = g; d[i+2] = b;
  }
  return copy;
}

// ============================================================
// Pixel Art
// ============================================================

function renderPixel(imgData) {
  const w = imgData.width, h = imgData.height;
  const block = +$('blockSize').value;
  const border = +$('pixelBorder').value;
  const round = $('roundPixels').checked;
  const colorLimit = +$('colorCount').value;
  const palette = getPalette();

  outputCanvas.width = w;
  outputCanvas.height = h;
  outCtx.fillStyle = '#000';
  outCtx.fillRect(0, 0, w, h);

  const d = imgData.data;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      let tr = 0, tg = 0, tb = 0, count = 0;
      const bw = Math.min(block, w - x);
      const bh = Math.min(block, h - y);
      for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
          const i = ((y + by) * w + (x + bx)) * 4;
          tr += d[i]; tg += d[i+1]; tb += d[i+2];
          count++;
        }
      }
      let r = Math.round(tr / count);
      let g = Math.round(tg / count);
      let b = Math.round(tb / count);

      if (palette) [r, g, b] = nearestColor(r, g, b, palette);
      else if (colorLimit > 0) {
        const levels = colorLimit;
        r = Math.round(r / 255 * (levels-1)) / (levels-1) * 255;
        g = Math.round(g / 255 * (levels-1)) / (levels-1) * 255;
        b = Math.round(b / 255 * (levels-1)) / (levels-1) * 255;
      }

      outCtx.fillStyle = `rgb(${r},${g},${b})`;
      const px = x + border;
      const py = y + border;
      const pw = bw - border * 2;
      const ph = bh - border * 2;
      if (pw <= 0 || ph <= 0) continue;

      if (round) {
        const cx = px + pw / 2, cy = py + ph / 2;
        const radius = Math.min(pw, ph) / 2;
        outCtx.beginPath();
        outCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        outCtx.fill();
      } else {
        outCtx.fillRect(px, py, pw, ph);
      }
    }
  }
  applyZoom();
}

// ============================================================
// Dot Matrix
// ============================================================

function renderDot(imgData) {
  const w = imgData.width, h = imgData.height;
  const block = +$('blockSize').value;
  const scale = +$('dotScale').value;
  const shape = $('dotShape').value;
  const bgColor = $('dotBgColor').value;
  const palette = getPalette();

  outputCanvas.width = w;
  outputCanvas.height = h;
  outCtx.fillStyle = bgColor;
  outCtx.fillRect(0, 0, w, h);

  const d = imgData.data;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      let tr = 0, tg = 0, tb = 0, count = 0;
      const bw = Math.min(block, w - x);
      const bh = Math.min(block, h - y);
      for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
          const i = ((y + by) * w + (x + bx)) * 4;
          tr += d[i]; tg += d[i+1]; tb += d[i+2];
          count++;
        }
      }
      let r = Math.round(tr / count);
      let g = Math.round(tg / count);
      let b = Math.round(tb / count);
      if (palette) [r, g, b] = nearestColor(r, g, b, palette);

      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const maxR = (block / 2) * scale;
      const dotR = maxR * lum;
      if (dotR < 0.5) continue;

      const cx = x + block / 2;
      const cy = y + block / 2;
      outCtx.fillStyle = `rgb(${r},${g},${b})`;

      if (shape === 'circle') {
        outCtx.beginPath();
        outCtx.arc(cx, cy, dotR, 0, Math.PI * 2);
        outCtx.fill();
      } else if (shape === 'square') {
        outCtx.fillRect(cx - dotR, cy - dotR, dotR * 2, dotR * 2);
      } else if (shape === 'diamond') {
        outCtx.beginPath();
        outCtx.moveTo(cx, cy - dotR);
        outCtx.lineTo(cx + dotR, cy);
        outCtx.lineTo(cx, cy + dotR);
        outCtx.lineTo(cx - dotR, cy);
        outCtx.closePath();
        outCtx.fill();
      } else if (shape === 'cross') {
        const t = dotR * 0.35;
        outCtx.fillRect(cx - dotR, cy - t, dotR * 2, t * 2);
        outCtx.fillRect(cx - t, cy - dotR, t * 2, dotR * 2);
      }
    }
  }
  applyZoom();
}

// ============================================================
// ASCII Art
// ============================================================

function renderAscii(imgData) {
  const w = imgData.width, h = imgData.height;
  const block = +$('blockSize').value;
  const colored = $('coloredAscii').checked;
  const charsetKey = $('charset').value;
  let chars;
  if (charsetKey === 'braille') {
    return renderBrailleAscii(imgData);
  } else if (charsetKey === 'custom') {
    chars = $('customCharset').value || '@#S%?*+;:,. ';
  } else {
    chars = CHARSETS[charsetKey] || CHARSETS.standard;
  }

  const d = imgData.data;
  let html = '';
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += Math.round(block * 0.55)) {
      let tr = 0, tg = 0, tb = 0, count = 0;
      const bw = Math.min(Math.round(block * 0.55), w - x);
      const bh = Math.min(block, h - y);
      for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
          const i = ((y + by) * w + (x + bx)) * 4;
          tr += d[i]; tg += d[i+1]; tb += d[i+2];
          count++;
        }
      }
      const r = Math.round(tr / count);
      const g = Math.round(tg / count);
      const b = Math.round(tb / count);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const ci = Math.floor(lum * (chars.length - 1));
      const ch = chars[chars.length - 1 - ci] || ' ';

      if (colored) {
        html += `<span style="color:rgb(${r},${g},${b})">${escHtml(ch)}</span>`;
      } else {
        html += escHtml(ch);
      }
    }
    html += '\n';
  }

  const fsize = +$('fontSize').value;
  asciiOutput.style.fontSize = fsize + 'px';
  asciiOutput.style.lineHeight = (fsize * 1.05) + 'px';
  asciiOutput.classList.toggle('colored', colored);
  asciiOutput.innerHTML = html;
  asciiOutput.style.display = '';
  outputCanvas.style.display = 'none';
}

function renderBrailleAscii(imgData) {
  const w = imgData.width, h = imgData.height;
  const d = imgData.data;
  const colored = $('coloredAscii').checked;
  const threshold = 128;
  const bw = 2, bh = 4;
  const block = +$('blockSize').value;
  const scaleX = Math.max(1, Math.round(block * 0.5));
  const scaleY = Math.max(1, block);

  const offsets = [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[0,3],[1,3]];
  let html = '';

  for (let y = 0; y < h; y += bh * scaleY) {
    for (let x = 0; x < w; x += bw * scaleX) {
      let code = 0x2800;
      let tr = 0, tg = 0, tb = 0, cnt = 0;
      for (let bit = 0; bit < 8; bit++) {
        const dx = offsets[bit][0] * scaleX;
        const dy = offsets[bit][1] * scaleY;
        const px = x + dx, py = y + dy;
        if (px >= w || py >= h) continue;
        const i = (py * w + px) * 4;
        const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        tr += d[i]; tg += d[i+1]; tb += d[i+2]; cnt++;
        if (lum < threshold) code |= (1 << bit);
      }
      const ch = String.fromCharCode(code);
      if (colored && cnt > 0) {
        const r = Math.round(tr / cnt), g = Math.round(tg / cnt), b = Math.round(tb / cnt);
        html += `<span style="color:rgb(${r},${g},${b})">${ch}</span>`;
      } else {
        html += ch;
      }
    }
    html += '\n';
  }

  const fsize = +$('fontSize').value;
  asciiOutput.style.fontSize = fsize + 'px';
  asciiOutput.style.lineHeight = (fsize * 1.05) + 'px';
  asciiOutput.classList.toggle('colored', colored);
  asciiOutput.innerHTML = html;
  asciiOutput.style.display = '';
  outputCanvas.style.display = 'none';
}

// ============================================================
// Halftone
// ============================================================

function renderHalftone(imgData) {
  const w = imgData.width, h = imgData.height;
  const block = +$('blockSize').value;
  const angle = (+$('halftoneAngle').value) * Math.PI / 180;
  const sizeScale = +$('halftoneSize').value;
  const cmyk = $('halftoneCMYK').checked;

  outputCanvas.width = w;
  outputCanvas.height = h;
  outCtx.fillStyle = cmyk ? '#fff' : '#000';
  outCtx.fillRect(0, 0, w, h);

  const d = imgData.data;

  if (cmyk) {
    const channels = [
      { angle: angle, color: [0, 255, 255], extract: (r,g,b) => 1 - r / 255 },
      { angle: angle + 15 * Math.PI / 180, color: [255, 0, 255], extract: (r,g,b) => 1 - g / 255 },
      { angle: angle + 30 * Math.PI / 180, color: [255, 255, 0], extract: (r,g,b) => 1 - b / 255 },
      { angle: angle + 45 * Math.PI / 180, color: [0, 0, 0], extract: (r,g,b) => {
        const k = 1 - Math.max(r, g, b) / 255;
        return k;
      }},
    ];
    outCtx.globalCompositeOperation = 'multiply';
    channels.forEach(ch => renderHalftoneChannel(imgData, block, ch.angle, sizeScale, ch.color, ch.extract));
    outCtx.globalCompositeOperation = 'source-over';
  } else {
    for (let y = 0; y < h; y += block) {
      for (let x = 0; x < w; x += block) {
        let tr = 0, tg = 0, tb = 0, count = 0;
        const bw = Math.min(block, w - x), bh = Math.min(block, h - y);
        for (let by = 0; by < bh; by++) {
          for (let bx = 0; bx < bw; bx++) {
            const i = ((y + by) * w + (x + bx)) * 4;
            tr += d[i]; tg += d[i+1]; tb += d[i+2]; count++;
          }
        }
        const r = tr / count, g = tg / count, b = tb / count;
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const dotR = (block / 2) * lum * sizeScale;
        if (dotR < 0.3) continue;

        const cx = x + block / 2, cy = y + block / 2;
        const rx = cx * Math.cos(angle) - cy * Math.sin(angle);
        const ry = cx * Math.sin(angle) + cy * Math.cos(angle);
        const gx = Math.round(rx / block) * block;
        const gy = Math.round(ry / block) * block;
        const fx = gx * Math.cos(-angle) - gy * Math.sin(-angle);
        const fy = gx * Math.sin(-angle) + gy * Math.cos(-angle);

        outCtx.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
        outCtx.beginPath();
        outCtx.arc(cx, cy, dotR, 0, Math.PI * 2);
        outCtx.fill();
      }
    }
  }
  applyZoom();
}

function renderHalftoneChannel(imgData, block, angle, sizeScale, color, extract) {
  const w = imgData.width, h = imgData.height;
  const d = imgData.data;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      let total = 0, count = 0;
      const bw = Math.min(block, w - x), bh = Math.min(block, h - y);
      for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
          const i = ((y + by) * w + (x + bx)) * 4;
          total += extract(d[i], d[i+1], d[i+2]);
          count++;
        }
      }
      const val = total / count;
      const dotR = (block / 2) * val * sizeScale;
      if (dotR < 0.3) continue;

      const cx = x + block / 2, cy = y + block / 2;
      outCtx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
      outCtx.beginPath();
      outCtx.arc(cx, cy, dotR, 0, Math.PI * 2);
      outCtx.fill();
    }
  }
}

// ============================================================
// Palette Helpers
// ============================================================

function getPalette() {
  const key = $('paletteSelect').value;
  if (key === 'none' || !PALETTES[key]) return null;
  return PALETTES[key].map(hex => {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return [r, g, b];
  });
}

function nearestColor(r, g, b, palette) {
  let minDist = Infinity, best = [r, g, b];
  for (const [pr, pg, pb] of palette) {
    const dist = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
    if (dist < minDist) { minDist = dist; best = [pr, pg, pb]; }
  }
  return best;
}

function updatePalettePreview() {
  const key = $('paletteSelect').value;
  const grid = $('palettePreview');
  grid.innerHTML = '';
  if (!PALETTES[key]) return;
  PALETTES[key].forEach(hex => {
    const el = document.createElement('div');
    el.className = 'color-swatch';
    el.style.background = hex;
    el.title = hex;
    grid.appendChild(el);
  });
}

// ============================================================
// UI Helpers
// ============================================================

function updateModeControls() {
  $$('.mode-controls').forEach(el => el.classList.add('hidden'));
  const ctrlId = state.mode + 'Controls';
  const ctrl = $(ctrlId);
  if (ctrl) ctrl.classList.remove('hidden');

  const isAscii = state.mode === 'ascii';
  $('exportTextBtn').classList.toggle('hidden', !isAscii);
  $('copyAsciiBtn').classList.toggle('hidden', !isAscii);
  $('exportPngBtn').classList.toggle('hidden', isAscii);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/ /g,'&nbsp;');
}

// ============================================================
// Export
// ============================================================

function exportPng() {
  if (!state.sourceImg) return;
  const link = document.createElement('a');
  link.download = `pixelforge_${state.mode}_${Date.now()}.png`;
  link.href = outputCanvas.toDataURL('image/png');
  link.click();
}

function exportText() {
  const text = asciiOutput.innerText;
  if (!text) return;
  const blob = new Blob([text], { type: 'text/plain' });
  const link = document.createElement('a');
  link.download = `pixelforge_ascii_${Date.now()}.txt`;
  link.href = URL.createObjectURL(blob);
  link.click();
}

async function copyAscii() {
  const text = asciiOutput.innerText;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    $('copyAsciiBtn').textContent = '✓ 已复制';
    setTimeout(() => { $('copyAsciiBtn').textContent = '📋 复制到剪贴板'; }, 2000);
  } catch { alert('复制失败'); }
}

// Init
updateModeControls();
updatePalettePreview();
